name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 3.4.8-mobile.1）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Build mobile web assets
        run: pnpm exec vite build --config vite.config.mobile.ts

      - name: Add Capacitor Android
        run: |
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/preferences
          if [ ! -d "android" ]; then
            pnpm exec cap add android || true
          fi
          pnpm exec cap sync android

      - name: Inject app metadata
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME:-mobile-dev}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyfun-mobile-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
